<!doctype html>
<!-- Plantilla del visor.
     mosaico.py la copia a salida/visor/index.html junto con datos.js (versión local, sin cifrar).
     publicar.py la copia a salida/publicar/index.html junto con cifrado.js (versión con contraseña). -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Fotomosaico</title>
<style>
  :root {
    --fondo: #0e0e10;
    --texto: #f2f0eb;
    --suave: #a19d94;
    --acento: #ffcc4d;
    --error: #ff7b6b;
    --panel: rgba(20, 20, 22, .82);
    --borde: rgba(255, 255, 255, .12);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--fondo); color: var(--texto);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  #vista { position: fixed; inset: 0; cursor: crosshair; touch-action: none; }
  #vista.arrastrando { cursor: grabbing; }
  /* Capas, de abajo arriba:
     #capa   mosaico de baja resolución (escalado con transform)
     #hd     fotos HD de las casillas visibles + foto principal semitransparente (#velo).
             Van en píxeles de pantalla, sin scale(), para que el navegador las pinte siempre nítidas.
     #marcas recuadros de "Ver dónde aparece" (escalado con transform, igual que #capa) */
  #capa, #marcas { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; }
  #capa > img { display: block; user-select: none; -webkit-user-drag: none; }
  #hd { position: absolute; left: 0; top: 0; pointer-events: none; }
  #hd img { position: absolute; display: block; user-select: none; -webkit-user-drag: none; }
  #fotosHD img { opacity: 0; transition: opacity .25s; }
  #fotosHD img.lista { opacity: 1; }
  #fotosHD img.volteada { transform: scaleX(-1); }

  /* bordes en coordenadas de la imagen: --g compensa el zoom para que siempre midan ~2px */
  #marca, .aparicion {
    position: absolute; pointer-events: none;
    outline: calc(var(--g, 1px) * 2) solid var(--acento);
    box-shadow: 0 0 0 calc(var(--g, 1px) * 3) rgba(0, 0, 0, .55);
  }
  #marca { display: none; }
  .aparicion { animation: latido 1.2s ease-in-out infinite; }
  @keyframes latido { 50% { outline-color: #fff; } }

  /* título sobre la foto: sin recuadro, siempre visible */
  #cabecera {
    position: fixed; top: 0; left: 0; right: 0; z-index: 4; pointer-events: none;
    padding: 18px 16px 34px; text-align: center;
    /* degradado (no recuadro) para que se lea sobre las fotos al hacer zoom */
    background: linear-gradient(to bottom, rgba(14, 14, 16, .88) 0%, rgba(14, 14, 16, .6) 60%, rgba(14, 14, 16, 0) 100%);
  }
  #cabecera h1 {
    margin: 0; font: 500 clamp(26px, 4.2vw, 46px)/1.1 "Cormorant Garamond", Georgia, "Times New Roman", serif;
    letter-spacing: .01em; text-shadow: 0 1px 3px rgba(0, 0, 0, .7);
  }
  #cabecera p {
    margin: 6px 0 0; color: var(--suave);
    font: italic 400 clamp(15px, 1.7vw, 19px)/1.3 "Cormorant Garamond", Georgia, serif;
  }
  #cabecera p:empty { display: none; }

  #tarjeta {
    position: fixed; left: 0; top: 0; pointer-events: none; z-index: 5;
    background: #000; padding: 6px; border-radius: 10px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, .65), 0 0 0 1px var(--borde);
    opacity: 0; transform: scale(.85); transform-origin: var(--ox, 0) var(--oy, 0);
    transition: opacity .12s, transform .12s;
  }
  #tarjeta.visible { opacity: 1; transform: scale(1); }
  #tarjeta img {
    display: block; width: auto; height: auto;
    max-width: min(340px, 70vw); max-height: min(340px, 55vh);
    min-width: 120px; min-height: 120px; object-fit: contain;
    border-radius: 6px; background: #1a1a1c;
  }
  #tarjeta .pie { font-size: 12px; color: var(--suave); padding: 5px 2px 0; display: flex; justify-content: space-between; gap: 12px; }


  button {
    font: inherit; color: var(--texto); background: rgba(255, 255, 255, .08);
    border: 1px solid var(--borde); border-radius: 8px; padding: 6px 11px; cursor: pointer;
    min-width: 36px;
  }
  button:hover { background: rgba(255, 255, 255, .16); }
  button:disabled { opacity: .55; cursor: not-allowed; }
  button.primario { background: var(--acento); color: #1a1405; border-color: transparent; font-weight: 600; }
  button.primario:hover:not(:disabled) { filter: brightness(1.08); }
  #limpiar {
    position: fixed; z-index: 4; left: 50%; bottom: 16px; transform: translateX(-50%); display: none;
    background: var(--panel); backdrop-filter: blur(8px);
  }

  /* foto ampliada / galería de todas las fotos */
  #ampliada {
    position: fixed; inset: 0; z-index: 10; display: none;
    background: rgba(5, 5, 6, .96); padding: 16px 16px 12px;
    flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    touch-action: pan-y;
  }
  #ampliada.abierta { display: flex; }
  #ampliada img {
    max-width: 100%; max-height: calc(100vh - 120px); border-radius: 8px; box-shadow: 0 20px 60px #000;
    user-select: none; -webkit-user-drag: none; transition: opacity .2s;
  }
  #ampliada img.cargando { opacity: .25; }
  #ampliada .barra { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 10px; }
  #ampliada .info { color: var(--suave); font-size: 13px; }
  .flecha {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 1;
    width: 52px; height: 76px; padding: 0; font-size: 38px; line-height: 1;
    background: rgba(255, 255, 255, .06); border-radius: 12px;
  }
  #anterior { left: 12px; }
  #siguiente { right: 12px; }
  @media (max-width: 600px) {
    .flecha { width: 40px; height: 60px; font-size: 30px; background: rgba(0, 0, 0, .45); }
    #anterior { left: 4px; }
    #siguiente { right: 4px; }
  }
  #galeria {
    position: fixed; z-index: 4; right: 16px; bottom: 16px;
    background: var(--panel); backdrop-filter: blur(8px);
  }

  /* ---------- acceso con usuario y contraseña */
  #acceso {
    position: fixed; inset: 0; z-index: 20; display: none;
    align-items: center; justify-content: center; padding: 16px;
    background: radial-gradient(ellipse at 50% 30%, #1d1c1a 0%, var(--fondo) 70%);
  }
  #acceso.visible { display: flex; }
  #acceso form {
    width: min(360px, 100%); padding: 26px 24px 22px; display: flex; flex-direction: column; gap: 14px;
    background: var(--panel); border: 1px solid var(--borde); border-radius: 16px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, .55);
  }
  #acceso h1 { margin: 0; font-size: 20px; font-weight: 650; }
  #acceso p { margin: 0; color: var(--suave); font-size: 13px; }
  #acceso label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--suave); }
  #acceso input {
    font: inherit; font-size: 15px; color: var(--texto); background: rgba(0, 0, 0, .35);
    border: 1px solid var(--borde); border-radius: 9px; padding: 9px 11px; outline: none;
  }
  #acceso input:focus { border-color: var(--acento); }
  #acceso button { padding: 10px; font-size: 15px; }
  #mensaje { min-height: 1.45em; font-size: 13px; color: var(--suave); }
  #mensaje.error { color: var(--error); }

  #error { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 16px; text-align: center; color: var(--suave); }

</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&display=swap">
</head>
<body>
  <div id="vista">
    <div id="capa"><img id="mosaico" alt="Fotomosaico" draggable="false"></div>
    <div id="hd">
      <div id="fotosHD"></div>
      <img id="velo" alt="" draggable="false">
    </div>
    <div id="marcas"><div id="marca"></div></div>
  </div>

  <div id="cabecera"><h1 id="titulo"></h1><p id="subtitulo"></p></div>
  <button id="limpiar" title="Quitar las marcas (Esc)">Quitar marcas</button>

  <div id="tarjeta"><img alt=""><div class="pie"><span class="usos"></span></div></div>

  <button id="galeria" title="Ver todas las fotos una a una">Todas las fotos</button>

  <div id="ampliada" role="dialog" aria-label="Foto">
    <button class="flecha" id="anterior" aria-label="Foto anterior (←)">‹</button>
    <img alt="">
    <button class="flecha" id="siguiente" aria-label="Foto siguiente (→)">›</button>
    <div class="barra">
      <span class="info"></span>
      <button id="pase" title="Pasar las fotos automáticamente (espacio)">▶ Presentación</button>
      <button class="primario" id="donde">Ver dónde aparece</button>
      <button id="cerrar">Cerrar (Esc)</button>
    </div>
  </div>

  <div id="acceso">
    <form autocomplete="on">
      <h1>Acceso privado</h1>
      <p>Introduce el usuario y la contraseña que te han dado.</p>
      <label>Usuario <input id="usuario" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      <label>Contraseña <input id="contrasena" name="password" type="password" autocomplete="current-password" required></label>
      <button class="primario" id="entrar" type="submit">Entrar</button>
      <div id="mensaje" role="status" aria-live="polite"></div>
    </form>
  </div>

  <div id="error"><div>
    <p>Este archivo es solo la <b>plantilla</b> del visor.</p>
    <p>Abre <b>salida/visor/index.html</b> (se crea al ejecutar <code>mosaico.py</code>).</p>
  </div></div>

  <script src="cifrado.js"></script>
  <script>
  (function () {
    const $ = (s) => document.querySelector(s);

    if (window.MOSAICO) arrancar(window.MOSAICO, (ruta) => Promise.resolve(ruta));  // versión local
    else if (window.CIFRADO) pedirAcceso(window.CIFRADO);                           // versión publicada
    else $("#error").style.display = "flex";

    // =====================================================================================
    // Acceso: la contraseña no se comprueba contra nada guardado. Con usuario + contraseña se
    // deriva una clave (PBKDF2) y con ella se intentan descifrar los datos (AES-GCM). Si la
    // clave no es la correcta, el descifrado falla. Sin la contraseña, los archivos son ilegibles.
    // =====================================================================================
    function pedirAcceso(C) {
      const ESPERA = 5000;  // ms de espera tras cada intento fallido
      const form = $("#acceso form"), boton = $("#entrar"), mensaje = $("#mensaje");
      const usuario = $("#usuario"), contrasena = $("#contrasena");
      $("#acceso").classList.add("visible");
      usuario.focus();

      if (location.protocol === "file:") {
        mensaje.textContent = "Esta versión necesita un servidor web: súbela al hosting o usa  python publicar.py --probar";
        mensaje.className = "error";
      }

      // la espera se recuerda aunque se recargue la página
      const leerBloqueo = () => { try { return +localStorage.getItem("mosaico-bloqueo") || 0; } catch (e) { return 0; } };
      const guardarBloqueo = (t) => { try { localStorage.setItem("mosaico-bloqueo", String(t)); } catch (e) {} };
      let reloj = 0;
      function esperar(hasta, texto) {
        clearInterval(reloj);
        const tic = () => {
          const resta = Math.ceil((hasta - Date.now()) / 1000);
          if (resta <= 0) {
            clearInterval(reloj);
            boton.disabled = false;
            boton.textContent = "Entrar";
            mensaje.textContent = texto;
            contrasena.focus();
            return;
          }
          boton.disabled = true;
          boton.textContent = `Espera ${resta} s`;
        };
        tic();
        reloj = setInterval(tic, 250);
      }
      if (leerBloqueo() > Date.now()) esperar(leerBloqueo(), "");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (boton.disabled) return;
        boton.disabled = true;
        boton.textContent = "Comprobando…";
        mensaje.className = "";
        mensaje.textContent = "";
        try {
          const clave = await derivarClave(usuario.value, contrasena.value, C);
          const datos = JSON.parse(new TextDecoder().decode(await descifrar(clave, b64(C.datos))));
          contrasena.value = "";
          $("#acceso").classList.remove("visible");
          arrancar(datos, cargadorCifrado(clave, datos.archivos));
        } catch (err) {
          const hasta = Date.now() + ESPERA;
          guardarBloqueo(hasta);
          contrasena.value = "";
          mensaje.className = "error";
          mensaje.textContent = "Usuario o contraseña incorrectos.";
          esperar(hasta, "Usuario o contraseña incorrectos. Puedes volver a intentarlo.");
        }
      });
    }

    function b64(texto) { return Uint8Array.from(atob(texto), (c) => c.charCodeAt(0)); }

    async function derivarClave(usuario, contrasena, C) {
      // el usuario no distingue mayúsculas ni espacios alrededor; la contraseña sí, exacta
      const material = new TextEncoder().encode(usuario.trim().toLowerCase() + "\u0000" + contrasena);
      const base = await crypto.subtle.importKey("raw", material, "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", hash: "SHA-256", salt: b64(C.sal), iterations: C.iteraciones },
        base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    }

    // formato de cada archivo cifrado: 12 bytes de nonce + texto cifrado con etiqueta GCM
    function descifrar(clave, bytes) {
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes.slice(0, 12) }, clave, bytes.slice(12));
    }

    function cargadorCifrado(clave, archivos) {
      const cache = new Map();  // ruta lógica -> Promise<URL blob>
      return (ruta) => {
        if (!cache.has(ruta)) {
          const p = fetch(archivos[ruta])
            .then((r) => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
            .then((b) => descifrar(clave, new Uint8Array(b)))
            .then((plano) => URL.createObjectURL(new Blob([plano], { type: "image/jpeg" })));
          p.catch(() => cache.delete(ruta));  // si falla la red, se reintentará la próxima vez
          cache.set(ruta, p);
        }
        return cache.get(ruta);
      };
    }

    // =====================================================================================
    // Visor. url(ruta) devuelve la dirección de una imagen: tal cual en la versión local,
    // o descargada y descifrada en la versión publicada.
    // =====================================================================================
    function arrancar(D, url) {
      const vista = $("#vista"), capa = $("#capa"), img = $("#mosaico"), marca = $("#marca");
      const tarjeta = $("#tarjeta"), tImg = tarjeta.querySelector("img");
      const ampliada = $("#ampliada"), aImg = ampliada.querySelector("img");
      const cabecera = $("#cabecera");

      document.title = D.titulo;
      $("#titulo").textContent = D.titulo;
      $("#subtitulo").textContent = D.subtitulo || "";

      let W = 0, H = 0, lado = 0;           // tamaño de la imagen y de cada casilla (px de imagen)
      let esc = 1, escMin = 1, escMax = 1, tx = 0, ty = 0;
      let fotoAbierta = -1;

      const veces = (u) => u === 1 ? "1 vez" : `${u} veces`;
      const ruta = (tam, f) => `fotos/${tam}/${D.fotos[f].a}`;

      const marcas = $("#marcas"), capaHD = $("#hd"), fotosHD = $("#fotosHD"), velo = $("#velo");
      function aplicar() {
        if (!W) return;
        const t = `translate(${tx}px, ${ty}px) scale(${esc})`;
        capa.style.transform = t;
        marcas.style.transform = t;
        marcas.style.setProperty("--g", `${1 / esc}px`);
        capaHD.style.transform = `translate(${tx}px, ${ty}px)`;
        velo.style.width = W * esc + "px";
        velo.style.height = H * esc + "px";
        actualizarHD();
      }

      // ---------- fotos en alta resolución: solo las casillas visibles y solo con zoom suficiente
      const MIN_HD = 40;                       // px de pantalla por casilla a partir de los que se carga HD
      const volteadas = new Set(D.volteadas || []);
      const hd = new Map();                    // índice de casilla -> <img>
      velo.style.opacity = D.mezcla || 0;
      if (D.mezcla) url("principal.jpg").then((u) => { velo.src = u; });
      else velo.style.display = "none";
      let escHD = 0;                           // escala con la que están colocadas las fotos HD
      function colocarHD(el, i, m) {
        const c = i % D.cols, f = Math.floor(i / D.cols);
        const x0 = Math.round(c * m), y0 = Math.round(f * m);  // redondeo para que no queden rendijas
        el.style.left = x0 + "px";
        el.style.top = y0 + "px";
        el.style.width = Math.round((c + 1) * m) - x0 + "px";
        el.style.height = Math.round((f + 1) * m) - y0 + "px";
      }
      function actualizarHD() {
        const m = lado * esc, visibles = new Set();
        if (m >= MIN_HD) {
          const c0 = Math.max(0, Math.floor(-tx / m)), c1 = Math.min(D.cols - 1, Math.floor((innerWidth - tx) / m));
          const f0 = Math.max(0, Math.floor(-ty / m)), f1 = Math.min(D.filas - 1, Math.floor((innerHeight - ty) / m));
          for (let f = f0; f <= f1; f++) for (let c = c0; c <= c1; c++) visibles.add(f * D.cols + c);
        }
        for (const [i, el] of hd) if (!visibles.has(i)) { el.remove(); hd.delete(i); }
        if (escHD !== esc) { for (const [i, el] of hd) colocarHD(el, i, m); escHD = esc; }
        for (const i of visibles) {
          if (hd.has(i)) continue;
          const el = new Image();
          el.decoding = "async";
          el.alt = "";
          if (volteadas.has(i)) el.className = "volteada";
          colocarHD(el, i, m);
          el.onload = () => el.classList.add("lista");
          url(ruta("c", D.celdas[i])).then((u) => { if (hd.get(i) === el) el.src = u; }, () => {});
          fotosHD.appendChild(el);
          hd.set(i, el);
        }
      }
      let entero = true;                    // ¿se está viendo el mosaico completo (sin zoom del usuario)?
      let vw = innerWidth, vh = innerHeight;

      // hueco arriba para el título (la foto entera queda debajo, sin taparse)
      const altoTitulo = () => (D.titulo ? cabecera.offsetHeight - 18 : 0);  // el degradado puede pisar la foto
      function limites() {
        const margen = innerWidth < 600 ? 8 : 24;
        const encaje = Math.min((innerWidth - 2 * margen) / W, (innerHeight - 2 * margen - altoTitulo()) / H);
        escMin = encaje * 0.6;
        escMax = Math.max(encaje * 4, 360 / lado);  // al máximo, cada casilla mide ~360px en pantalla
        return encaje;
      }
      function ajustar() {
        if (!W) return;
        esc = limites();
        const arriba = altoTitulo();
        tx = (innerWidth - W * esc) / 2;
        ty = arriba + (innerHeight - arriba - H * esc) / 2;
        entero = true;
        aplicar();
      }
      // al cambiar el tamaño de la ventana (o girar el móvil) se conserva el zoom y el punto central
      function redimensionar() {
        if (!W) return;
        if (entero) { vw = innerWidth; vh = innerHeight; return ajustar(); }
        const cx = (vw / 2 - tx) / esc, cy = (vh / 2 - ty) / esc;
        vw = innerWidth; vh = innerHeight;
        limites();
        esc = Math.min(escMax, Math.max(escMin, esc));
        tx = vw / 2 - cx * esc;
        ty = vh / 2 - cy * esc;
        aplicar();
      }
      function zoom(px, py, factor) {
        if (!W) return;
        const nueva = Math.min(escMax, Math.max(escMin, esc * factor));
        tx = px - (px - tx) * (nueva / esc);
        ty = py - (py - ty) * (nueva / esc);
        esc = nueva;
        entero = false;
        aplicar();
      }

      // casilla bajo un punto de la pantalla (o null)
      function casilla(x, y) {
        if (!W) return null;
        const c = Math.floor((x - tx) / esc / lado), f = Math.floor((y - ty) / esc / lado);
        if (c < 0 || f < 0 || c >= D.cols || f >= D.filas) return null;
        return { c, f, foto: D.celdas[f * D.cols + c] };
      }

      // ---------- tarjeta al pasar el ratón
      let actual = null;
      function mostrarTarjeta(cs, x, y) {
        if (!cs) return ocultarTarjeta();
        if (!actual || actual.c !== cs.c || actual.f !== cs.f) {
          actual = cs;
          Object.assign(marca.style, { display: "block", left: cs.c * lado + "px", top: cs.f * lado + "px", width: lado + "px", height: lado + "px" });
          const info = D.fotos[cs.foto], f = String(cs.foto);
          if (tImg.dataset.f !== f) {
            tImg.dataset.f = f;
            tImg.removeAttribute("src");
            url(ruta("m", cs.foto)).then((u) => { if (tImg.dataset.f === f) tImg.src = u; }, () => {});
          }
          tarjeta.querySelector(".usos").textContent = info.u ? `aparece ${veces(info.u)}` : "";
        }
        tarjeta.classList.add("visible");
        colocarTarjeta(x, y);
      }
      function colocarTarjeta(x, y) {
        const r = tarjeta.getBoundingClientRect(), sep = 22;
        let left = x + sep, top = y + sep, ox = 0, oy = 0;
        if (left + r.width > innerWidth - 8) { left = x - sep - r.width; ox = r.width; }
        if (top + r.height > innerHeight - 8) { top = y - sep - r.height; oy = r.height; }
        tarjeta.style.left = Math.max(8, left) + "px";
        tarjeta.style.top = Math.max(8, top) + "px";
        tarjeta.style.setProperty("--ox", ox + "px");
        tarjeta.style.setProperty("--oy", oy + "px");
      }
      function ocultarTarjeta() {
        actual = null;
        marca.style.display = "none";
        tarjeta.classList.remove("visible");
      }
      tImg.addEventListener("load", () => { if (actual) colocarTarjeta(ultX, ultY); });

      // ---------- foto ampliada y galería, en orden aleatorio (distinto en cada visita)
      const N = D.fotos.length;
      const orden = D.fotos.map((_, i) => i);
      for (let i = N - 1; i > 0; i--) {  // Fisher-Yates
        const j = Math.floor(Math.random() * (i + 1));
        [orden[i], orden[j]] = [orden[j], orden[i]];
      }
      const posicion = [];               // foto -> su lugar en el orden
      orden.forEach((f, p) => { posicion[f] = p; });
      const vecina = (f, d) => orden[(posicion[f] + d + N) % N];
      const PASE_MS = 4000;
      let pase = 0;
      function abrir(f) {
        fotoAbierta = f;
        const info = D.fotos[f];
        aImg.classList.add("cargando");
        url(ruta("g", f)).then((u) => { if (fotoAbierta === f) aImg.src = u; }, () => {});
        ampliada.querySelector(".info").textContent =
          `${posicion[f] + 1} / ${N} · ` + (info.u ? `aparece ${veces(info.u)} en el mosaico` : "no sale en el mosaico");
        $("#donde").style.display = info.u ? "" : "none";
        ampliada.classList.add("abierta");
        ocultarTarjeta();
        // precarga las vecinas para que pasar de foto sea instantáneo
        for (const d of [1, -1]) url(ruta("g", vecina(f, d))).catch(() => {});
      }
      aImg.addEventListener("load", () => aImg.classList.remove("cargando"));
      const mover = (d) => abrir(vecina(fotoAbierta, d));
      function pararPase() { clearInterval(pase); pase = 0; $("#pase").textContent = "▶ Presentación"; }
      function alternarPase() {
        if (pase) return pararPase();
        pase = setInterval(() => mover(1), PASE_MS);
        $("#pase").textContent = "❚❚ Pausa";
      }
      function cerrar() {
        pararPase();
        ampliada.classList.remove("abierta");
        aImg.removeAttribute("src");
        fotoAbierta = -1;
      }
      // cambiar a mano reinicia la cuenta de la presentación
      const moverAMano = (d) => { mover(d); if (pase) { pararPase(); alternarPase(); } };
      $("#anterior").onclick = () => moverAMano(-1);
      $("#siguiente").onclick = () => moverAMano(1);
      $("#pase").onclick = alternarPase;
      $("#galeria").onclick = () => abrir(orden[0]);
      // deslizar el dedo a los lados en el móvil
      let toque = null;
      ampliada.addEventListener("pointerdown", (e) => { if (e.pointerType !== "mouse") toque = { x: e.clientX, y: e.clientY }; });
      ampliada.addEventListener("pointerup", (e) => {
        if (!toque) return;
        const dx = e.clientX - toque.x, dy = e.clientY - toque.y;
        toque = null;
        if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) { deslizado = true; moverAMano(dx < 0 ? 1 : -1); }
      });
      let deslizado = false;  // tras deslizar, el navegador también lanza un clic: no debe cerrar
      function limpiarApariciones() {
        marcas.querySelectorAll(".aparicion").forEach((e) => e.remove());
        $("#limpiar").style.display = "none";
      }
      function mostrarApariciones(f) {
        limpiarApariciones();
        const frag = document.createDocumentFragment();
        D.celdas.forEach((v, i) => {
          if (v !== f) return;
          const d = document.createElement("div");
          d.className = "aparicion";
          Object.assign(d.style, { left: (i % D.cols) * lado + "px", top: Math.floor(i / D.cols) * lado + "px", width: lado + "px", height: lado + "px" });
          frag.appendChild(d);
        });
        marcas.appendChild(frag);
        $("#limpiar").style.display = "inline-block";
      }
      $("#donde").onclick = () => { const f = fotoAbierta; cerrar(); ajustar(); mostrarApariciones(f); };
      $("#cerrar").onclick = cerrar;
      ampliada.addEventListener("click", (e) => {
        if (deslizado) { deslizado = false; return; }
        if (e.target === ampliada) cerrar();
      });
      $("#limpiar").onclick = limpiarApariciones;

      // ---------- ratón, táctil y teclado
      const punteros = new Map();
      let arrastre = null, pellizco = null, ultX = 0, ultY = 0;

      vista.addEventListener("pointerdown", (e) => {
        vista.setPointerCapture(e.pointerId);
        punteros.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (punteros.size === 1) {
          arrastre = { x: e.clientX, y: e.clientY, tx, ty, movido: false };
        } else if (punteros.size === 2) {
          const [a, b] = [...punteros.values()];
          pellizco = { d: Math.hypot(a.x - b.x, a.y - b.y), esc };
          arrastre = null;
        }
      });
      vista.addEventListener("pointermove", (e) => {
        ultX = e.clientX; ultY = e.clientY;
        if (punteros.has(e.pointerId)) punteros.set(e.pointerId, { x: e.clientX, y: e.clientY });

        if (pellizco && punteros.size === 2) {
          const [a, b] = [...punteros.values()];
          const d = Math.hypot(a.x - b.x, a.y - b.y);
          zoom((a.x + b.x) / 2, (a.y + b.y) / 2, (pellizco.esc * d / pellizco.d) / esc);
          return;
        }
        if (arrastre) {
          const dx = e.clientX - arrastre.x, dy = e.clientY - arrastre.y;
          if (!arrastre.movido && Math.hypot(dx, dy) > 5) {
            arrastre.movido = true;
            vista.classList.add("arrastrando");
            ocultarTarjeta();
          }
          if (arrastre.movido) {
            tx = arrastre.tx + dx; ty = arrastre.ty + dy;
            entero = false;
            aplicar();
            return;
          }
        }
        if (e.pointerType === "mouse") mostrarTarjeta(casilla(e.clientX, e.clientY), e.clientX, e.clientY);
      });
      function soltar(e) {
        punteros.delete(e.pointerId);
        if (punteros.size < 2) pellizco = null;
        if (arrastre && !arrastre.movido && e.type === "pointerup") {
          const cs = casilla(e.clientX, e.clientY);
          if (cs) {
            // táctil: primer toque muestra la tarjeta, segundo toque en la misma casilla amplía
            if (e.pointerType !== "mouse" && !(actual && actual.c === cs.c && actual.f === cs.f)) mostrarTarjeta(cs, e.clientX, e.clientY);
            else abrir(cs.foto);
          } else ocultarTarjeta();
        }
        if (punteros.size === 0) { arrastre = null; vista.classList.remove("arrastrando"); }
      }
      vista.addEventListener("pointerup", soltar);
      vista.addEventListener("pointercancel", soltar);
      vista.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse" && !arrastre) ocultarTarjeta(); });

      vista.addEventListener("wheel", (e) => {
        e.preventDefault();
        const delta = e.deltaMode === 1 ? e.deltaY * 33 : e.deltaY;
        zoom(e.clientX, e.clientY, Math.exp(-delta * 0.0015));
        mostrarTarjeta(casilla(e.clientX, e.clientY), e.clientX, e.clientY);
      }, { passive: false });

      const centro = () => [innerWidth / 2, innerHeight / 2];
      addEventListener("keydown", (e) => {
        const abierta = ampliada.classList.contains("abierta");
        if (abierta && e.key === "ArrowRight") moverAMano(1);
        else if (abierta && e.key === "ArrowLeft") moverAMano(-1);
        else if (abierta && e.key === " ") { e.preventDefault(); alternarPase(); }
        else if (e.key === "Escape") { if (abierta) cerrar(); else limpiarApariciones(); }
        else if (e.key === "+" || e.key === "=") zoom(...centro(), 1.5);
        else if (e.key === "-") zoom(...centro(), 1 / 1.5);
        else if (e.key === "0") ajustar();
      });
      addEventListener("resize", redimensionar);

      img.addEventListener("load", () => {
        W = img.naturalWidth; H = img.naturalHeight; lado = W / D.cols;
        ajustar();
      });
      // cuando llega la tipografía del título cambia su altura: se reencaja si no hay zoom
      if (document.fonts) document.fonts.ready.then(() => { if (entero) ajustar(); });
      url("mosaico.jpg").then((u) => { img.src = u; });
    }
  })();
  </script>
</body>
</html>
